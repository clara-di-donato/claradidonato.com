# Publishes the site on GitHub Pages every time you push to the main branch.
# On the first run it also copies the photos from the old Squarespace site into
# the repo (assets/img/ and s/), so the site keeps working after Squarespace is cancelled.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download any missing photos
        run: bash scripts/download-assets.sh

      - name: Save downloaded photos in the repo
        run: |
          git add assets/img s
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add photos copied from the old Squarespace site"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
